<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#252b30"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>KS関数電卓</title><style>
*{box-sizing:border-box}body{margin:0;background:#171a1d;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center}.calc{width:min(100%,440px);min-height:100dvh;background:linear-gradient(110deg,#343b40,#24292d);padding:16px 12px 22px;display:flex;flex-direction:column;gap:9px}.brand{font-weight:bold;font-size:20px;letter-spacing:1px}.sub{font-size:11px;color:#ccd4d6}.screen{background:#bdcbb4;color:#18251e;border:7px solid #161b1d;border-radius:9px;min-height:145px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 12px #7f9182}.expression{font-size:21px;overflow-wrap:anywhere;min-height:56px}.result{text-align:right;font-size:28px;overflow-wrap:anywhere}.status{font-size:12px;min-height:15px;color:#dbe4bd}.key{border:1px solid #12181b;border-radius:9px;background:linear-gradient(#59646c,#323b42);color:#f4f7f8;min-height:45px;display:flex;flex-direction:column;justify-content:center;align-items:center;touch-action:manipulation;user-select:none;box-shadow:0 3px 1px #121719;padding:2px;font-size:clamp(14px,4vw,20px)}.key:active{transform:translateY(2px);box-shadow:0 1px 1px #121719}.key .secondary{font-size:9px;min-height:13px;color:#e3dc91;white-space:nowrap}.key.number{background:linear-gradient(#7e8992,#515d66);font-size:27px}.key.green{background:linear-gradient(#b3d977,#74a34a)}.key.del{background:linear-gradient(#9bc86b,#648f38)}.key.active{outline:2px solid #e4dc8c}.footer{font-size:10px;color:#b4c2c9;text-align:center;margin-top:3px}.history{display:none;max-height:130px;overflow:auto;background:#151c1d;padding:8px;font-size:13px}.history.show{display:block}.history div{padding:5px;border-bottom:1px solid #3a4144}

/* v0.1.1: fit the calculator into the available iPhone viewport */
html,body{height:100%;overflow:hidden}body{height:100dvh}.calc{height:100dvh;min-height:0;padding:calc(env(safe-area-inset-top) + 5px) 9px calc(env(safe-area-inset-bottom) + 4px);gap:clamp(3px,.55dvh,7px);overflow:hidden}.calc>div:first-child{flex:0 0 auto}.brand{font-size:clamp(13px,2.2dvh,19px)}.sub{font-size:clamp(8px,1.2dvh,11px)}.screen{flex:0 0 clamp(84px,17dvh,145px);min-height:0;border-width:5px;padding:7px}.expression{font-size:clamp(16px,2.7dvh,22px);min-height:0}.result{font-size:clamp(21px,3.6dvh,30px)}.status{font-size:10px;min-height:12px}
.top {
  flex: 0 0 clamp(72px, 11dvh, 100px);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1.5fr)) repeat(3, minmax(0, 1fr)) repeat(2, minmax(0, 1.5fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  grid-template-areas:
    "shift alpha . up . mode on"
    "shift alpha left . right mode on"
    ". . . down . . .";
  gap: 4px;
}
.top [data-key="SHIFT"] { grid-area: shift; }
.top [data-key="ALPHA"] { grid-area: alpha; }
.top [data-key="▲"] { grid-area: up; }
.top [data-key="◀"] { grid-area: left; }
.top [data-key="▶"] { grid-area: right; }
.top [data-key="▼"] { grid-area: down; }
.top [data-key="MODE"] { grid-area: mode; }
.top [data-key="ON"] { grid-area: on; }
.top .key { font-size: clamp(10px, 3.25vw, 15px); }
.top .secondary:empty { display: none; }

.keys {
  flex: 1 1 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(5px, 0.9dvh, 9px);
}
.key-group {
  display: grid;
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: clamp(3px, 0.5dvh, 5px);
}
.function-keys { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.number-pad { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.key{min-height:0;border-radius:7px;font-size:clamp(12px,2.2dvh,20px);padding:0 1px;box-shadow:0 2px 1px #121719}.key .secondary{font-size:clamp(7px,1.1dvh,10px);min-height:0}.key.number{font-size:clamp(18px,3.1dvh,27px)}.footer{flex:0 0 auto;font-size:clamp(7px,1dvh,10px);margin:0}.history.show{position:absolute;z-index:4;left:5%;right:5%;top:25%;max-height:40dvh;overflow:auto;border:2px solid #899a9d}.key:focus-visible{outline:2px solid white}
@media(max-height:650px){.sub,.footer{display:none}.screen{flex-basis:14dvh}.calc{gap:2px}}
</style></head><body><main class="calc"><div><div class="brand">CASIO <span style="float:right;font-size:12px">KS EDITION</span></div><div class="sub">fx-375ESA · NATURAL-V.P.A.M. inspired</div></div><div class="screen"><div class="status" id="status">DEG · COMP</div><div class="expression" id="expr"></div><div class="result" id="result">0</div></div><div class="history" id="history"></div><div class="top" id="top"></div><div class="keys"><div class="key-group function-keys" id="function-keys" role="group" aria-label="関数キー"></div><div class="key-group number-pad" id="number-pad" role="group" aria-label="テンキー"></div></div><div class="footer">v0.1.4 · 1画面表示 · オフライン対応 · 計算結果は近似値の場合があります</div></main><script>
const functionRows = [
  [['CALC', 'SOLVE'], ['∫', 'd/dx'], null, null, ['x⁻¹', 'x!'], ['logₐ', 'Σ']],
  [['a/b', 'a b/c'], ['√', '³√'], ['x²', 'x³'], ['xʸ', 'ʸ√x'], ['log', '10ˣ'], ['ln', 'eˣ']],
  [['(−)', ''], ['°′″', '←'], ['hyp', 'Abs'], ['sin', 'sin⁻¹'], ['cos', 'cos⁻¹'], ['tan', 'tan⁻¹']],
  [['RCL', 'STO'], ['ENG', '←'], ['(', '%'], [')', ','], ['S⇔D', 'd/c'], ['M+', 'M−']],
];
const numberRows = [
  [['7', 'CONST'], ['8', 'CONV'], ['9', 'CLR'], ['DEL', 'INS'], ['AC', 'OFF']],
  [['4', ''], ['5', ''], ['6', ''], ['×', 'nPr'], ['÷', 'nCr']],
  [['1', 'STAT'], ['2', 'CMPLX'], ['3', 'BASE'], ['+', 'Pol'], ['−', 'Rec']],
  [['0', 'Rnd'], ['.', 'Ran#'], ['×10ˣ', 'π'], ['Ans', 'DRG'], ['=', '']],
];
const topKeys = [['SHIFT', ''], ['ALPHA', ''], ['▲', ''], ['MODE', 'SETUP'], ['ON', ''], ['◀', ''], ['▼', ''], ['▶', '']];
const $=id=>document.getElementById(id);let expr='',ans=0,shift=false,alpha=false,degree=true,memory=0,history=[],showDecimal=false;
let inputState = 'editing';
function buildKeys(parent, rows) {
  rows.forEach((row, rowIndex) => {
    row.forEach((entry, columnIndex) => {
      if (!entry) return;
      const [key, sub] = entry;
      const button = document.createElement('button');
      button.className = 'key';
      button.dataset.key = key;
      button.classList.toggle('number', /^[0-9.]$/.test(key));
      button.classList.toggle('green', key === 'AC');
      button.classList.toggle('del', key === 'DEL');
      if (parent.id !== 'top') {
        button.style.gridRow = rowIndex + 1;
        button.style.gridColumn = columnIndex + 1;
      }
      const secondary = document.createElement('span');
      secondary.className = 'secondary';
      secondary.textContent = sub;
      const primary = document.createElement('span');
      primary.textContent = key;
      button.append(secondary, primary);
      button.addEventListener('click', () => press(key));
      parent.append(button);
    });
  });
}
buildKeys($('top'), [topKeys]);
buildKeys($('function-keys'), functionRows);
buildKeys($('number-pad'), numberRows);
function render(){ $('expr').textContent=expr;$('status').textContent=`${shift?'SHIFT · ':''}${alpha?'ALPHA · ':''}${degree?'DEG':'RAD'} · COMP` ;document.querySelectorAll('.key').forEach(k=>k.classList.toggle('active',(shift&&k.textContent.includes('SHIFT'))||(alpha&&k.textContent.includes('ALPHA'))))}
function factorial(n){if(!Number.isInteger(n)||n<0||n>170)throw Error('Math ERROR');let v=1;for(let i=2;i<=n;i++)v*=i;return v}
function evaluate(s){if(!s.trim())return 0;let x=s.replace(/Ans/g,'answer').replace(/π/g,'Math.PI').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/√\(/g,'sqrt(').replace(/³√\(/g,'cbrt(').replace(/sin⁻¹\(/g,'asin(').replace(/cos⁻¹\(/g,'acos(').replace(/tan⁻¹\(/g,'atan(').replace(/sin\(/g,'sin(').replace(/cos\(/g,'cos(').replace(/tan\(/g,'tan(').replace(/ln\(/g,'log(').replace(/log\(/g,'log10(').replace(/10ˣ\(/g,'pow10(').replace(/eˣ\(/g,'exp(').replace(/abs\(/g,'abs(').replace(/(\banswer\b|\d+(?:\.\d+)?)!/g,'factorial($1)').replace(/(\banswer\b|\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[\d\s+\-*/().,!A-Za-z_]+$/.test(x))throw Error('Syntax ERROR');let allowed=['answer','Math.PI','sin','cos','tan','asin','acos','atan','sqrt','cbrt','log','log10','pow10','exp','abs','factorial'];let identifiers=x.match(/[A-Za-z_][A-Za-z_0-9.]*/g)||[];if(identifiers.some(t=>!allowed.includes(t)))throw Error('Syntax ERROR');let rad=a=>degree?a*Math.PI/180:a,derad=a=>degree?a*180/Math.PI:a;let f=Function('answer','sin','cos','tan','asin','acos','atan','sqrt','cbrt','log','log10','pow10','exp','abs','factorial',`return (${x})`);let value=f(ans,a=>Math.sin(rad(a)),a=>Math.cos(rad(a)),a=>Math.tan(rad(a)),a=>derad(Math.asin(a)),a=>derad(Math.acos(a)),a=>derad(Math.atan(a)),Math.sqrt,Math.cbrt,Math.log,Math.log10,a=>10**a,Math.exp,Math.abs,factorial);if(typeof value!=='number'||!Number.isFinite(value))throw Error('Math ERROR');return value}
const answerContinuationKeys = new Set(['+', '−', '×', '÷', 'a/b', 'x²', 'xʸ', 'x⁻¹', '×10ˣ']);
function startEditing(expression) {
  expr = expression;
  inputState = 'editing';
  $('result').textContent = '0';
}
function append(text, continueFromAnswer = false) {
  if (inputState !== 'editing') {
    startEditing(inputState === 'answer' && continueFromAnswer ? 'Ans' : '');
  }
  expr += text;
  render();
}
function deleteLast() {
  const shortened = expr.slice(0, -1);
  if (inputState === 'editing') expr = shortened;
  else startEditing(shortened);
  render();
}
function completeExpression(expression) {
  let open = 0;
  for (const character of expression) {
    if (character === '(') open++;
    if (character === ')') {
      open--;
      if (open < 0) throw new SyntaxError();
    }
  }
  return expression + ')'.repeat(open);
}
function calculate() {
  try {
    const completed = completeExpression(expr);
    const value = evaluate(completed);
    expr = completed;
    ans = value;
    const output = Number(value.toPrecision(12)).toString();
    $('result').textContent = output;
    inputState = 'answer';
    history.push([expr, output]);
    if (history.length > 100) history.shift();
  } catch (error) {
    $('result').textContent = error.message === 'Math ERROR' ? 'Math ERROR' : '式エラー';
    inputState = 'error';
  }
  render();
}
function press(key) {
  if (key === 'SHIFT' || key === 'ALPHA') {
    shift = key === 'SHIFT' && !shift;
    alpha = key === 'ALPHA' && !alpha;
    render();
    return;
  }
  if (key === 'ON') {
    startEditing('');
    render();
    return;
  }
  if (key === 'MODE') {
    degree = !degree;
    shift = false;
    render();
    return;
  }
  if (key === 'HIST') {
    const panel = $('history');
    panel.classList.toggle('show');
    panel.innerHTML = history.slice(-12).reverse().map(h => `<div>${h[0]} = ${h[1]}</div>`).join('');
    return;
  }
  if (key === '◀') {
    deleteLast();
    return;
  }
  if (['▶', '▲', '▼'].includes(key)) return;

  const shifted = shift;
  shift = false;
  alpha = false;
  if (key === 'AC') {
    if (shifted) {
      history = [];
      memory = 0;
      ans = 0;
    }
    startEditing('');
  } else if (key === 'DEL') {
    deleteLast();
    return;
  } else if (key === '=') {
    calculate();
    return;
  } else if (key === 'S⇔D') {
    showDecimal = !showDecimal;
    try {
      $('result').textContent = String(inputState === 'answer' ? ans : evaluate(expr));
    } catch {}
  } else if (key === 'M+') {
    try {
      memory += (shifted ? -1 : 1) * evaluate(expr);
    } catch {}
  } else if (key === 'RCL') {
    if (shifted) memory = evaluate(expr);
    else append(String(memory));
  } else if (key === 'Ans') {
    if (shifted) degree = !degree;
    else append('Ans');
  } else {
    const functions = {
      '√': shifted ? '³√(' : '√(',
      sin: shifted ? 'sin⁻¹(' : 'sin(',
      cos: shifted ? 'cos⁻¹(' : 'cos(',
      tan: shifted ? 'tan⁻¹(' : 'tan(',
      log: shifted ? '10ˣ(' : 'log(',
      ln: shifted ? 'eˣ(' : 'ln(',
      'x²': shifted ? '^3' : '^2',
      'xʸ': '^',
      'x⁻¹': shifted ? '!' : '^(-1)',
      '(': shifted ? '%' : '(',
      ')': ')',
      '(−)': '−',
      '×': '×',
      '÷': '÷',
      '−': '−',
      '+': '+',
      '×10ˣ': shifted ? 'π' : '×10^',
      'logₐ': 'log(',
      'a/b': '÷',
      'π': 'π',
      hyp: '',
      ENG: '',
      '°′″': '',
      CALC: '',
      '∫': '',
    };
    if (key === '.' && shifted) {
      append(String(Math.random()));
      return;
    }
    if (Object.hasOwn(functions, key)) {
      if (functions[key]) {
        append(functions[key], functions[key] !== 'π' && (answerContinuationKeys.has(key) || functions[key] === '%'));
        return;
      }
      $('result').textContent = '未実装';
    } else if (/^[0-9.]$/.test(key)) {
      append(key);
      return;
    }
  }
  render();
}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>

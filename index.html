</style></head><body><main class="calc"><div><div class="brand">CASIO <span style="float:right;font-size:12px">KS EDITION</span></div><div class="sub">fx-375ESA · NATURAL-V.P.A.M. inspired</div></div><div class="screen"><div class="status" id="status">DEG · COMP</div><div class="expression" id="expr"></div><div class="result" id="result">0</div></div><div class="history" id="history"></div><div class="top" id="top"></div><div class="keys"><div class="key-group function-keys" id="function-keys" role="group" aria-label="関数キー"></div><div class="key-group number-pad" id="number-pad" role="group" aria-label="テンキー"></div></div><div class="footer">v0.1.5 · 1画面表示 · オフライン対応 · 計算結果は近似値の場合があります</div></main><script>
const functionRows = [

  [['a/b', 'a b/c'], ['√', '³√'], ['x²', 'x³'], ['xʸ', 'ʸ√x'], ['log', '10ˣ'], ['ln', 'eˣ']],
  [['(−)', ''], ['°′″', '←'], ['hyp', 'Abs'], ['sin', 'sin⁻¹'], ['cos', 'cos⁻¹'], ['tan', 'tan⁻¹']],
  [['RCL', 'STO'], ['ENG', '←'], ['(', '%'], [')', ','], ['S⇔D', 'd/c'], ['M+', 'M−']],
];
const numberRows = [
  [['7', 'CONST'], ['8', 'CONV'], ['9', 'CLR'], ['DEL', 'INS'], ['AC', 'OFF']],
  [['4', ''], ['5', ''], ['6', ''], ['×', 'nPr'], ['÷', 'nCr']],
  [['1', 'STAT'], ['2', 'CMPLX'], ['3', 'BASE'], ['+', 'Pol'], ['−', 'Rec']],
  [['0', 'Rnd'], ['.', 'Ran#'], ['×10ˣ', 'π'], ['Ans', 'DRG'], ['=', '']],

const topKeys = [['SHIFT', ''], ['ALPHA', ''], ['▲', ''], ['MODE', 'SETUP'], ['ON', ''], ['◀', ''], ['▼', ''], ['▶', '']];
const $=id=>document.getElementById(id);let expr='',ans=0,shift=false,alpha=false,degree=true,memory=0,history=[];
let hyperbolic = false;
let resultFormat = 'decimal';
let engineeringExponent = 0;

let inputState = 'editing';
function buildKeys(parent, rows) {
  rows.forEach((row, rowIndex) => {
    row.forEach((entry, columnIndex) => {
      if (!entry) return;
      const [key, sub] = entry;
      const button = document.createElement('button');
      button.className = 'key';
      button.dataset.key = key;
      button.classList.toggle('number', /^[0-9.]$/.test(key));
      button.classList.toggle('green', key === 'AC');
      button.classList.toggle('del', key === 'DEL');
      if (parent.id !== 'top') {

        button.style.gridColumn = columnIndex + 1;

      const secondary = document.createElement('span');
      secondary.className = 'secondary';
      secondary.textContent = sub;
      const primary = document.createElement('span');
      primary.className = 'primary';
      primary.textContent = key;
      keyLabels.push({button, key, sub, primary, secondary});
      button.append(secondary, primary);
      button.addEventListener('click', () => press(key, sub));

  });
}
buildKeys($('top'), [topKeys]);
buildKeys($('function-keys'), functionRows);
buildKeys($('number-pad'), numberRows);
function render() {
  $('expr').textContent = expr;
  $('status').textContent = `${shift ? 'SHIFT · ' : ''}${alpha ? 'ALPHA · ' : ''}${hyperbolic ? 'HYP · ' : ''}${degree ? 'DEG' : 'RAD'} · COMP`;
  for (const {button, key, sub, primary, secondary} of keyLabels) {
    const hypTrig = hyperbolic && trigKeys.has(key);
    primary.textContent = hypTrig ? key + 'h' : key;
    secondary.textContent = hypTrig ? key + 'h⁻¹' : sub;
    button.classList.toggle('shifted', shift && Boolean(sub));
    button.classList.toggle('active', (shift && key === 'SHIFT') ||

  }
}
function factorial(value) {
  if (!Number.isInteger(value) || value < 0 || value > 170) throw Error('Math ERROR');
  let result = 1;
  for (let multiplier = 2; multiplier <= value; multiplier++) result *= multiplier;
  return result;
}
function evaluate(expression) {
  if (!expression.trim()) return 0;
  const radians = value => degree ? value * Math.PI / 180 : value;
  const angle = value => degree ? value * 180 / Math.PI : value;
  const functions = {
    answer: ans,
    sin: value => Math.sin(radians(value)),
    cos: value => Math.cos(radians(value)),
    tan: value => Math.tan(radians(value)),
    asin: value => angle(Math.asin(value)),
    acos: value => angle(Math.acos(value)),
    atan: value => angle(Math.atan(value)),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
    asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
    sqrt: Math.sqrt, cbrt: Math.cbrt, ln: Math.log, log10: Math.log10,
    pow10: value => 10 ** value, exp: Math.exp, abs: Math.abs, factorial,
  };
  const number = '(\\d+(?:\\.\\d*)?|\\.\\d+)';
  const sexagesimal = new RegExp(`${number}°(?:${number}′(?:${number}″)?)?`, 'g');
  const withoutLeadingZeroes = value => value.replace(/^0+(?=\d)/, '');
  const callableNames = {
    '√': 'sqrt', '³√': 'cbrt', '10ˣ': 'pow10', 'eˣ': 'exp', log: 'log10',
    'sin⁻¹': 'asin', 'cos⁻¹': 'acos', 'tan⁻¹': 'atan',
    'sinh⁻¹': 'asinh', 'cosh⁻¹': 'acosh', 'tanh⁻¹': 'atanh',
  };
  const translated = expression
    .replace(sexagesimal, (_, d, m = '0', s = '0') =>
      `(${withoutLeadingZeroes(d)}+${withoutLeadingZeroes(m)}/60+${withoutLeadingZeroes(s)}/3600)`)
    .replace(/(³√|√|10ˣ|eˣ|log|(?:sin|cos|tan)h?⁻¹)\(/g, (_, name) => callableNames[name] + '(')
    .replace(/Ans/g, 'answer').replace(/π/g, 'Math.PI')
    .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\^/g, '**')
    .replace(/(\banswer\b|\d+(?:\.\d+)?)!/g, 'factorial($1)')
    .replace(/(\banswer\b|\d+(?:\.\d+)?)%/g, '($1/100)');
  const identifiers = translated.match(/[A-Za-z_][A-Za-z_0-9.]*/g) || [];
  if (!/^[\d\s+\-*/().,!A-Za-z_]+$/.test(translated) ||
      identifiers.some(name => name !== 'Math.PI' && !Object.hasOwn(functions, name))) {
    throw new SyntaxError();
  }

  const value = calculateValue(...Object.values(functions));

  return value;
}
function decimalText(value) {
  return Number(value.toPrecision(12)).toString();
}
function fractionText(value, mixed) {
  const magnitude = Math.abs(value);
  if (Number.isInteger(magnitude)) return null;

  // Use a small denominator and require agreement within floating-point rounding.
  let previousNumerator = 0;
  let previousDenominator = 1;
  let numerator = 1;
  let denominator = 0;
  let remainder = magnitude;
  while (Number.isFinite(remainder)) {
    const integer = Math.floor(remainder);
    const nextNumerator = integer * numerator + previousNumerator;
    const nextDenominator = integer * denominator + previousDenominator;
    if (!Number.isSafeInteger(nextNumerator) || nextDenominator > 1000000) break;
    [previousNumerator, numerator] = [numerator, nextNumerator];
    [previousDenominator, denominator] = [denominator, nextDenominator];
    if (Math.abs(numerator / denominator - magnitude) <= 4 * Number.EPSILON * magnitude) {
      if (denominator === 1) return null;
      const sign = value < 0 ? '−' : '';
      if (mixed && numerator > denominator) {
        return `${sign}${Math.floor(numerator / denominator)} ${numerator % denominator}/${denominator}`;
      }
      return `${sign}${numerator}/${denominator}`;
    }
    remainder = 1 / (remainder - integer);
  }
  return null;
}
function sexagesimalText(value) {
  const magnitude = Math.abs(value);
  let degrees = Math.floor(magnitude);
  if (!Number.isSafeInteger(degrees)) return null;
  const secondsPerDegree = 3600;
  const unitsPerSecond = 1000000;
  let units = Math.round((magnitude - degrees) * secondsPerDegree * unitsPerSecond);
  if (units === secondsPerDegree * unitsPerSecond) {
    degrees++;
    units = 0;
  }
  const minutes = Math.floor(units / (60 * unitsPerSecond));
  const seconds = (units % (60 * unitsPerSecond)) / unitsPerSecond;

}
function resultDisplay(format, output) {
  resultFormat = format;
  $('result').textContent = output;
}
function toggleFraction(shifted) {
  if (inputState !== 'answer') return;
  if (!shifted && ['fraction', 'mixed'].includes(resultFormat)) {
    resultDisplay('decimal', decimalText(ans));
    return;
  }
  const mixed = shifted && resultFormat !== 'mixed';
  const output = fractionText(ans, mixed);
  if (output !== null) resultDisplay(mixed ? 'mixed' : 'fraction', output);
}
function showEngineering(reverse) {
  if (inputState !== 'answer') return;
  const [mantissa, exponentText] = ans.toExponential(11).split('e');
  const exponent = Number(exponentText);
  const base = Math.floor(exponent / 3) * 3;
  let next = base;
  if (ans !== 0) {
    if (resultFormat === 'engineering') next = engineeringExponent + (reverse ? 3 : -3);
    else if (reverse) next += 3;
    if (Math.abs(exponent - next) > 12) return;

  engineeringExponent = next;
  const coefficient = Number(`${mantissa}e${exponent - next}`).toLocaleString('en-US', {
    useGrouping: false, maximumSignificantDigits: 12,

  const superscript = String(next).replace(/[-0-9]/g, char => char === '-' ? '⁻' : '⁰¹²³⁴⁵⁶⁷⁸⁹'[Number(char)]);
  resultDisplay('engineering', `${coefficient} × 10${superscript}`);
}
function pressSexagesimal() {
  if (inputState === 'answer') {
    if (resultFormat === 'sexagesimal') resultDisplay('decimal', decimalText(ans));
    else {
      const output = sexagesimalText(ans);
      if (output !== null) resultDisplay('sexagesimal', output);
    }
    return;
  }
  const term = expr.match(/[0-9.°′″]+$/)?.[0] || '';
  const marks = term.match(/[°′″]/g) || [];
  if (marks.length < 3 && /\d(?:\.\d*)?$/.test(term)) append('°′″'[marks.length]);
}
const answerContinuationKeys = new Set(['+', '−', '×', '÷', 'a/b', 'x²', 'xʸ', 'x⁻¹', '×10ˣ']);
function startEditing(expression) {
  expr = expression;
  inputState = 'editing';
  resultDisplay('decimal', '0');
}
function append(text, continueFromAnswer = false) {
  if (inputState !== 'editing') {
    startEditing(inputState === 'answer' && continueFromAnswer ? 'Ans' : '');
  }
  expr += text;
  render();
}
function deleteLast() {
  const shortened = expr.slice(0, -1);
  if (inputState === 'editing') expr = shortened;
  else startEditing(shortened);
  render();
}
function completeExpression(expression) {
  let open = 0;
  for (const character of expression) {
    if (character === '(') open++;
    if (character === ')') {
      open--;
      if (open < 0) throw new SyntaxError();
    }
  }
  return expression + ')'.repeat(open);
}
function calculate() {
  try {
    const completed = completeExpression(expr);
    const value = evaluate(completed);
    expr = completed;
    ans = value;
    const output = decimalText(value);

    inputState = 'answer';
    history.push([expr, output]);
    if (history.length > 100) history.shift();

function press(key, sub) {

    alpha = key === 'ALPHA' && !alpha;
    render();
    return;
  }

  const wasHyperbolic = hyperbolic;
  shift = false;
  alpha = false;
  hyperbolic = false;
  if (key === 'ON') {
    startEditing('');
    render();
    return;
  }
  if (key === 'MODE') {
    degree = !degree;
    render();
    return;
  }

    const panel = $('history');
    panel.classList.toggle('show');
    panel.innerHTML = history.slice(-12).reverse().map(h => `<div>${h[0]} = ${h[1]}</div>`).join('');
    return;

  if (key === '◀') {
    deleteLast();
    return;
  }
  if (['▶', '▲', '▼'].includes(key)) {
    render();
    return;
  }
  if (shifted && sub && !supportedShift.has(key)) {
    $('result').textContent = '未実装';
    render();
    return;
  }
  if (key === 'AC') {
    if (shifted) {
      history = [];
      memory = 0;
      ans = 0;
    }
    startEditing('');

    deleteLast();
    return;
  } else if (key === '=') {
    calculate();
    return;

    toggleFraction(shifted);
  } else if (key === 'ENG') {
    showEngineering(shifted);

  } else if (trigKeys.has(key)) {
    append(key + (wasHyperbolic ? 'h' : '') + (shifted ? '⁻¹(' : '('));

      memory += (shifted ? -1 : 1) * value;
    } catch {}

    if (shifted) memory = inputState === 'answer' ? ans : evaluate(expr);
    else append(String(memory));
  } else if (key === 'Ans') {
    if (shifted) degree = !degree;
    else append('Ans');
  } else {
    const functions = {
      '√': shifted ? '³√(' : '√(',
      log: shifted ? '10ˣ(' : 'log(',
      ln: shifted ? 'eˣ(' : 'ln(',
      'x²': shifted ? '^3' : '^2',
      'xʸ': '^',
      'x⁻¹': shifted ? '!' : '^(-1)',
      '(': shifted ? '%' : '(',
      ')': ')',
      '(−)': '−',
      '×': '×',
      '÷': '÷',
      '−': '−',
      '+': '+',
      '×10ˣ': shifted ? 'π' : '×10^',
      'logₐ': 'log(',
      'a/b': '÷',
      'π': 'π',
      CALC: '',
      '∫': '',

    if (key === '.' && shifted) {
      append(String(Math.random()));
      return;
    }
    if (Object.hasOwn(functions, key)) {

      }

      return;

}

</style></head><body><main class="calc"><div><div class="brand">CASIO <span style="float:right;font-size:12px">KS EDITION</span></div><div class="sub">fx-375ESA · NATURAL-V.P.A.M. inspired</div></div><div class="screen"><div class="status" id="status">DEG · COMP</div><div class="expression" id="expr"></div><div class="result" id="result">0</div></div><div class="history" id="history"></div><div class="top" id="top"></div><div class="keys" id="keys"></div><div class="footer">v0.1.0 · オフライン対応 · 計算結果は近似値の場合があります</div></main><script>

const $=id=>document.getElementById(id);let expr='',ans=0,shift=false,alpha=false,degree=true,memory=0,history=[],showDecimal=false;
function build(parent,arr){for(const [key,sub] of arr){let b=document.createElement('button');b.className='key '+(/^[0-9.]$/.test(key)?'number ':'')+(['AC'].includes(key)?'green ':['DEL'].includes(key)?'del ':'')+(['SHIFT','ALPHA','MODE'].includes(key)?'special':'');b.innerHTML=`<span class="secondary">${sub||'　'}</span><span>${key}</span>`;b.addEventListener('click',()=>press(key,sub));parent.append(b)}}build($('top'),topKeys);build($('keys'),[...upper,...lower]);
function render(){ $('expr').textContent=expr;$('status').textContent=`${shift?'SHIFT · ':''}${alpha?'ALPHA · ':''}${degree?'DEG':'RAD'} · COMP` ;document.querySelectorAll('.key').forEach(k=>k.classList.toggle('active',(shift&&k.textContent.includes('SHIFT'))||(alpha&&k.textContent.includes('ALPHA'))))}
function factorial(n){if(!Number.isInteger(n)||n<0||n>170)throw Error('Math ERROR');let v=1;for(let i=2;i<=n;i++)v*=i;return v}
function evaluate(s){if(!s.trim())return 0;let x=s.replace(/Ans/g,`(${ans})`).replace(/π/g,'Math.PI').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/√\(/g,'sqrt(').replace(/³√\(/g,'cbrt(').replace(/sin⁻¹\(/g,'asin(').replace(/cos⁻¹\(/g,'acos(').replace(/tan⁻¹\(/g,'atan(').replace(/sin\(/g,'sin(').replace(/cos\(/g,'cos(').replace(/tan\(/g,'tan(').replace(/ln\(/g,'log(').replace(/log\(/g,'log10(').replace(/10ˣ\(/g,'pow10(').replace(/eˣ\(/g,'exp(').replace(/abs\(/g,'abs(').replace(/(\d+(?:\.\d+)?)!/g,'factorial($1)').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[\d\s+\-*/().,!A-Za-z_]+$/.test(x))throw Error('Syntax ERROR');let allowed=['Math.PI','sin','cos','tan','asin','acos','atan','sqrt','cbrt','log','log10','pow10','exp','abs','factorial'];let identifiers=x.match(/[A-Za-z_][A-Za-z_0-9.]*/g)||[];if(identifiers.some(t=>!allowed.includes(t)))throw Error('Syntax ERROR');let rad=a=>degree?a*Math.PI/180:a,derad=a=>degree?a*180/Math.PI:a;let f=Function('sin','cos','tan','asin','acos','atan','sqrt','cbrt','log','log10','pow10','exp','abs','factorial',`return (${x})`);let value=f(a=>Math.sin(rad(a)),a=>Math.cos(rad(a)),a=>Math.tan(rad(a)),a=>derad(Math.asin(a)),a=>derad(Math.acos(a)),a=>derad(Math.atan(a)),Math.sqrt,Math.cbrt,Math.log,Math.log10,a=>10**a,Math.exp,Math.abs,factorial);if(typeof value!=='number'||!Number.isFinite(value))throw Error('Math ERROR');return value}
function append(s){expr+=s;render()}
function press(k,sub){if(k==='SHIFT'){shift=!shift;alpha=false;render();return}if(k==='ALPHA'){alpha=!alpha;shift=false;render();return}if(k==='ON'){expr='';render();return}if(k==='MODE'){if(shift){degree=!degree;shift=false}else degree=!degree;render();return}if(k==='HIST'){let el=$('history');el.classList.toggle('show');el.innerHTML=history.slice(-12).reverse().map(h=>`<div>${h[0]} = ${h[1]}</div>`).join('');return}if(k==='◀'){expr=expr.slice(0,-1);render();return}if(k==='▶'){return}let s=shift;shift=false;alpha=false;
if(k==='AC'){if(s){history=[];memory=0;ans=0}expr='';$('result').textContent='0';render();return}if(k==='DEL'){expr=expr.slice(0,-1);render();return}if(k==='='){try{let val=evaluate(expr);ans=val;let out=Number(val.toPrecision(12)).toString();$('result').textContent=out;history.push([expr,out]);if(history.length>100)history.shift()}catch(e){$('result').textContent=e.message||'ERROR'}render();return}if(k==='S⇔D'){showDecimal=!showDecimal;try{$('result').textContent=String(evaluate(expr))}catch{}render();return}if(k==='M+'){try{memory+=(s?-1:1)*evaluate(expr)}catch{}render();return}if(k==='RCL'){if(s){memory=evaluate(expr)}else append(String(memory));render();return}if(k==='Ans'){if(s){degree=!degree;render()}else append('Ans');return}
const funcs={'√':'√(','sin':s?'sin⁻¹(':'sin(','cos':s?'cos⁻¹(':'cos(','tan':s?'tan⁻¹(':'tan(','log':s?'10ˣ(':'log(','ln':s?'eˣ(':'ln(','x²':'^2','xʸ':'^','x⁻¹':'^(-1)','(':'(',')':')','(−)':'−','×':'×','÷':'÷','−':'−','+':'+','×10ˣ':'×10^','hyp':'','ENG':'','°′″':'','logₐ':'log(','a/b':'÷','CALC':'','∫':'','π':'π'};
if(k==='x²'&&s){append('^3');return}if(k==='√'&&s){append('³√(');return}if(k==='x⁻¹'&&s){append('!');return}if(k==='×10ˣ'&&s){append('π');return}if(k==='.'&&s){append(String(Math.random()));return}if(k==='('&&s){append('%');return}if(k in funcs){if(funcs[k])append(funcs[k]);else {$('result').textContent='未実装'}render();return}if(/^[0-9.]$/.test(k))append(k);else render()}

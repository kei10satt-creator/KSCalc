  if (inputState === 'answer') {
    if (typeof ans !== 'number' || resultFormat === 'coordinates') return;
    if (resultFormat === 'sexagesimal') resultDisplay('decimal', decimalText(ans));
    else {
      const output = sexagesimalText(ans);
      if (output !== null) resultDisplay('sexagesimal', output);
    }
    return;
  }
  const term = expr.match(/[0-9.°′″]+$/)?.[0] || '';
  const marks = term.match(/[°′″]/g) || [];
  if (marks.length < 3 && /\d(?:\.\d*)?$/.test(term)) append('°′″'[marks.length]);
}
const answerContinuationKeys = new Set(['+', '−', '×', '÷', 'a/b', 'x²', 'xʸ', 'x⁻¹', '×10ˣ']);
function startEditing(expression) {
  expr = expression;
  inputState = 'editing';
  resultDisplay('decimal', '0');
}
function append(text, continueFromAnswer = false) {
  if (inputState !== 'editing') {
    startEditing(inputState === 'answer' && continueFromAnswer ? 'Ans' : '');
  }
  expr += text;
  render();
}
function deleteLast() {
  const shortened = expr.slice(0, -1);
  if (inputState === 'editing') expr = shortened;
  else startEditing(shortened);
  render();
}
function completeExpression(expression) {
  let open = 0;
  for (const character of expression) {
    if (character === '(') open++;
    if (character === ')') {
      open--;
      if (open < 0) throw new SyntaxError();
    }
  }
  return expression + ')'.repeat(open);
}
function calculate() {
  try {
    const completed = completeExpression(expr || (inputState === 'answer' ? 'Ans' : ''));
    const value = evaluate(completed);
    expr = completed;
    const coordinates = typeof value === 'object' && value.coordinates;
    ans = coordinates ? value.re : value;
    const labels = coordinates === 'polar' ? ['r', 'θ'] : ['x', 'y'];
    const output = coordinates
      ? `${labels[0]}=${decimalText(value.re)}  ${labels[1]}=${decimalText(value.im)}`
      : formatAnswer(value);
    resultDisplay(coordinates ? 'coordinates' : 'decimal', output);
    inputState = 'answer';
    history.push([expr, output]);
    if (history.length > 100) history.shift();
  } catch (error) {
    $('result').textContent = error.message === 'Math ERROR' ? 'Math ERROR' : '式エラー';
    inputState = 'error';
  }
  render();
}
function press(key, sub) {
  if (setupPage) {
    pressSetup(key);
    return;
  }
  if (key === 'SHIFT' || key === 'ALPHA') {
    shift = key === 'SHIFT' && !shift;
    alpha = key === 'ALPHA' && !alpha;
    render();
    return;
  }
  const shifted = shift;
  const wasHyperbolic = hyperbolic;
  shift = false;
  alpha = false;
  hyperbolic = false;
  if (key === 'ON') {
    startEditing('');
    render();
    return;
  }
  if (key === 'MODE') {
    if (shifted) setupPage = 'menu';
    else if (mode !== 'BASE') degree = !degree;
    render();
    return;
  }
  if (key === 'HIST') {
    const panel = $('history');
    panel.classList.toggle('show');
    panel.innerHTML = history.slice(-12).reverse().map(h => `<div>${h[0]} = ${h[1]}</div>`).join('');
    return;
  }
  if (key === '◀') {
    deleteLast();
    return;
  }
  if (['▶', '▲', '▼'].includes(key)) {
    render();
    return;
  }
  if (shifted && key === '1') {
    $('statistics-panel').showModal();
    render();
    return;
  }
  if (shifted && (key === '2' || key === '3')) {
    setMode(key === '2' ? 'CMPLX' : 'BASE');
    return;
  }
  if (mode === 'BASE') {
    if (shifted && sub) render();
    else pressBase(key);
    return;
  }
  if (shifted && key === '7') {
    $('constants-panel').showModal();
    render();
    return;
  }
  if (shifted && sub && !supportedShift.has(key)) {
    $('result').textContent = '未実装';
    render();
    return;
  }
  if (key === 'AC') {
    if (shifted) {
      history = [];
      memory = 0;
      ans = 0;
    }
    startEditing('');
  } else if (key === 'DEL') {
    deleteLast();
    return;
  } else if (key === '=') {
    calculate();
    return;
  } else if (key === 'S⇔D') {
    toggleFraction(shifted);
  } else if (key === 'ENG') {
    if (mode === 'CMPLX' && !shifted) append('i');
    else showEngineering(shifted);
  } else if (key === '°′″') {
    pressSexagesimal();
  } else if (key === 'hyp') {
    if (shifted) append('abs(');
    else hyperbolic = !wasHyperbolic;
  } else if (trigKeys.has(key)) {
    append(key + (wasHyperbolic ? 'h' : '') + (shifted ? '⁻¹(' : '('));
  } else if (key === 'M+') {
    try {
      const value = inputState === 'answer' ? ans : evaluate(expr);
      if (typeof value === 'number') memory += (shifted ? -1 : 1) * value;
    } catch {}
  } else if (key === 'RCL') {
    if (shifted) {
      try {
        const value = inputState === 'answer' ? ans : evaluate(expr);
        if (typeof value === 'number') memory = value;
      } catch {}
    } else append(String(memory).replace(/^-/, '−'));
  } else if (key === 'Ans') {
    if (shifted) degree = !degree;
    else append('Ans');
  } else {
    const functions = {
      '√': shifted ? '³√(' : '√(',
      log: shifted ? '10ˣ(' : 'log(',
      ln: shifted ? 'eˣ(' : 'ln(',
      'x²': shifted ? '^3' : '^2',
      'xʸ': '^',
      'x⁻¹': shifted ? '!' : '^(−1)',
      '(': shifted ? '%' : '(',
      ')': shifted ? ',' : ')',
      '(−)': '−',
      '×': shifted ? 'nPr' : '×',
      '÷': shifted ? 'nCr' : '÷',
      '−': shifted ? 'Rec(' : '−',
      '+': shifted ? 'Pol(' : '+',
      '×10ˣ': shifted ? 'π' : '×10^',
      'logₐ': 'log(',
      'a/b': '÷',
      'π': 'π',
      '0': shifted ? 'Rnd(' : '0',
      CALC: '',
      '∫': '',
    };
    if (key === '.' && shifted) {
      append(String(Math.random()));
      return;
    }
    if (Object.hasOwn(functions, key)) {
      if (functions[key]) {
        append(functions[key], !['π', 'Pol(', 'Rec('].includes(functions[key]) && (answerContinuationKeys.has(key) || functions[key] === '%'));
        return;
      }
      $('result').textContent = '未実装';
    } else if (/^[0-9.]$/.test(key)) {
      append(key);
      return;
    }
  }
  render();
}
initializePanels();
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

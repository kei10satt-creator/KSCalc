  } else if (key === 'hyp') {
    if (shifted) append('abs(');
    else hyperbolic = !wasHyperbolic;
  } else if (trigKeys.has(key)) {
    append(key + (wasHyperbolic ? 'h' : '') + (shifted ? '⁻¹(' : '('));
  } else if (key === 'M+') {
    try {
      const value = inputState === 'answer' ? ans : evaluate(expr);
      if (typeof value === 'number') memory += (shifted ? -1 : 1) * value;
    } catch {}
  } else if (key === 'RCL') {
    if (shifted) {
      try {
        const value = inputState === 'answer' ? ans : evaluate(expr);
        if (typeof value === 'number') memory = value;
      } catch {}
    } else append(String(memory).replace(/^-/, '−'));
  } else if (key === 'Ans') {
    if (shifted) cycleAngleUnit();
    else append('Ans');
  } else {
    const functions = {
      '√': shifted ? '³√(' : '√(',
      log: shifted ? '10ˣ(' : 'log(',
      ln: shifted ? 'eˣ(' : 'ln(',
      'x²': shifted ? '^3' : '^2',
      'xʸ': '^',
      'x⁻¹': shifted ? '!' : '^(−1)',
      '(': shifted ? '%' : '(',
      ')': shifted ? ',' : ')',
      '(−)': '−',
      '×': shifted ? 'nPr' : '×',
      '÷': shifted ? 'nCr' : '÷',
      '−': shifted ? 'Rec(' : '−',
      '+': shifted ? 'Pol(' : '+',
      '×10ˣ': shifted ? 'π' : '×10^',
      'a/b': '÷',
      'π': 'π',
      '0': shifted ? 'Rnd(' : '0',
    };
    if (key === '.' && shifted) {
      append(String(Math.random()));
      return;
    }
    if (Object.hasOwn(functions, key)) {
      append(functions[key], !['π', 'Pol(', 'Rec('].includes(functions[key]) && (answerContinuationKeys.has(key) || functions[key] === '%'));
      return;
    } else if (/^[0-9.]$/.test(key)) {
      append(key);
      return;
    }
  }
  render();
}
initializePanels();
initializeEditingPanels();
